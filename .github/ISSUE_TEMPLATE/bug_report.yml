name: Bug report
description: A reproducible defect in the library, CLI, packaging, or documented behaviour
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use the Case template when the disagreement is about which policy should
        apply, or when two policies seem equally right. Use this form for a
        reproducible defect: a crash, traceback, CLI or packaging failure, or
        output that contradicts the documentation. Policy changes go through an
        RFC; see CONTRIBUTING.md.

        For a suspected vulnerability, use the private reporting route in
        SECURITY.md. Do not open a public issue with exploit details.

  - type: textarea
    id: expected-actual
    attributes:
      label: What happened, and what did you expect?
      description: Quote the exact output and name the documented behaviour it contradicts.
      placeholder: |
        `Selector().select(state, intent)` raised `AttributeError` for a state
        that the policy table documents as valid.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest transcript, Python snippet, or CLI invocation that shows the problem.
      placeholder: |
        1. Install with `python -m pip install -e ".[dev]"`
        2. Run the snippet or `eq-layer route` command below.
        3. Observe the selection or error.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Exact output, errors, and exit code
      description: Include the traceback and exit code, not only the final message.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version and install source
      description: Which version are you running, and was it installed from PyPI, npm, or a local checkout?
      placeholder: "0.2.5, local checkout"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface is affected?
      multiple: true
      options:
        - "Python library (`eq_layer`)"
        - "CLI (`eq-layer`)"
        - "npm installer or CLI bridge"
        - "Agent Skill (`skills/eq-layer/`)"
        - "Evaluation harness (`eval/`)"
        - "Install, build, or packaging"
        - "Documentation"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and Node version if the npm package is involved.
      placeholder: "Windows 11, CPython 3.12, Node.js 24"
    validations:
      required: true

  - type: textarea
    id: state
    attributes:
      label: Relevant control state
      description: If routing or selection is involved, paste the policy name, intent belief, affect state, or repair state. Redact private transcript text.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, related issues, or a proposed cause. Redact credentials and private data.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the open and closed issues for this problem.
          required: true
        - label: I read SECURITY.md and this is a defect, not a vulnerability.
          required: true
        - label: I removed credentials, private transcripts, and local paths from what I pasted.
          required: true
        - label: This is not a policy proposal; policy proposals belong in an RFC.
          required: true
        - label: I can reproduce this on the current version or on `main`.
          required: true
