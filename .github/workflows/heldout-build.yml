name: Build External Heldout

on:
  push:
    branches: [main]
    paths:
      - "tools/build_ab_heldout.py"
      - "eval/ab_case_preflight.py"
      - "eq_layer/response_experiment.py"
      - ".github/workflows/heldout-build.yml"
  workflow_dispatch:

concurrency:
  group: eq-layer-heldout-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build deterministic external held-out set
        run: |
          mkdir -p artifacts
          python tools/build_ab_heldout.py \
            --output artifacts/ab_heldout_120.jsonl \
            --manifest artifacts/ab_heldout_120.manifest.json \
            --seed 20261005
      - name: Enforce final held-out preflight
        run: python eval/ab_case_preflight.py artifacts/ab_heldout_120.jsonl --final
      - name: Upload frozen held-out artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eq-layer-ab-heldout-120
          path: |
            artifacts/ab_heldout_120.jsonl
            artifacts/ab_heldout_120.manifest.json
          if-no-files-found: error
