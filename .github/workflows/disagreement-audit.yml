name: Direct Disagreement Audit

on:
  push:
    branches: [main]
    paths:
      - "eq_layer/coarse_discourse.py"
      - "eq_layer/trained_disagreement.py"
      - "eval/coarse_discourse_inventory.py"
      - "eval/coarse_disagreement_eval.py"
      - ".github/workflows/disagreement-audit.yml"
  workflow_dispatch:

concurrency:
  group: eq-layer-disagreement-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ML dependencies
        run: python -m pip install -e ".[ml]"
      - name: Run Coarse Discourse inventory
        run: python eval/coarse_discourse_inventory.py
      - name: Run grouped disagreement benchmark
        run: python eval/coarse_disagreement_eval.py
