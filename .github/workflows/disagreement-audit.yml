name: Direct Disagreement Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eq-layer-disagreement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Coarse Discourse inventory
        run: python eval/coarse_discourse_inventory.py
