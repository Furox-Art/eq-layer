name: Length-Matched 12-Case Pilot

# Engineering pilot to answer one question cheaply: does pinning the surface
# budget close the 3.19x length gap between the EQ arm and the raw baseline?
# Not a quality claim. 12 cases, no human ratings.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lengthmatched-pilot.yml"

concurrency:
  group: eq-layer-lengthmatched-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: "error"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -e ".[ml]"
          python -m pip install "torch>=2.2,<3" "transformers>=4.46,<5"

      - name: Build external held-out source set
        run: |
          mkdir -p artifacts
          python tools/build_ab_heldout.py \
            --output artifacts/ab_heldout_120.jsonl \
            --manifest artifacts/ab_heldout_120.manifest.json \
            --seed 20261005

      - name: Train learned EQ-Layer components
        run: |
          python tools/train_emobank_affect.py \
            --output artifacts/emobank_affect.joblib
          python tools/train_xdailydialog_subtext.py \
            --output artifacts/xdailydialog_subtext.joblib

      - name: Generate three arms
        run: |
          python eval/ab_generate.py \
            artifacts/ab_heldout_120.jsonl \
            artifacts/qwen_lm12_pairs.jsonl \
            artifacts/qwen_lm12_generation_manifest.json \
            --model-command "python eval/hf_model_server.py --model-id Qwen/Qwen2.5-0.5B-Instruct --max-new-tokens 80 --cpu-threads 1" \
            --model-id Qwen/Qwen2.5-0.5B-Instruct \
            --affect-model artifacts/emobank_affect.joblib \
            --subtext-model artifacts/xdailydialog_subtext.joblib \
            --temperature 0 \
            --seed 42 \
            --limit 12 \
            --length-profile answer_only \
            --length-profile direct \
            --length-profile one_sentence \
            --length-profile shortest_complete \
            --persistent-model-command \
            --git-commit "$GITHUB_SHA"

      - name: Check generation reproducibility
        run: |
          python eval/reproducibility_check.py \
            --model-command "python eval/hf_model_server.py --model-id Qwen/Qwen2.5-0.5B-Instruct --max-new-tokens 80 --cpu-threads 1" \
            --output eval/results/qwen_reproducibility.json

      - name: Calibrate length control profile
        run: |
          python eval/length_calibration.py \
            artifacts/qwen_lm12_pairs.jsonl \
            --output eval/results/qwen_lm12_calibration.json

      - name: Compare arm lengths
        run: |
          python eval/length_report.py \
            artifacts/qwen_lm12_pairs.jsonl \
            --output eval/results/qwen_lm12_length.json

      - name: Upload pairs
        uses: actions/upload-artifact@v4
        with:
          name: eq-layer-qwen-lm12-pairs
          path: artifacts/qwen_lm12_pairs.jsonl
          if-no-files-found: error

      - name: Upload length report
        uses: actions/upload-artifact@v4
        with:
          name: eq-layer-qwen-lm12-length
          path: eval/results/qwen_lm12_length.json
          if-no-files-found: error

      - name: Upload calibration
        uses: actions/upload-artifact@v4
        with:
          name: eq-layer-qwen-lm12-calibration
          path: eval/results/qwen_lm12_calibration.json
          if-no-files-found: error

      - name: Upload reproducibility check
        uses: actions/upload-artifact@v4
        with:
          name: eq-layer-qwen-reproducibility
          path: eval/results/qwen_reproducibility.json
          if-no-files-found: error