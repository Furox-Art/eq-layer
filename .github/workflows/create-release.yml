name: Create GitHub Release

on:
  push:
    branches: [main]
    paths:
      - ".release-request"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify requested version
        id: version
        run: |
          requested="$(tr -d '[:space:]' < .release-request)"
          actual="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          test "$requested" = "$actual"
          prerelease="$(python - "$actual" <<'PY'
          import re
          import sys

          version = sys.argv[1]
          print("true" if re.search(r"(a|b|rc|dev|alpha|beta|pre|preview)", version, re.IGNORECASE) else "false")
          PY
          )"
          echo "version=$actual" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          else
            args=(--target "${GITHUB_SHA}" --title "v$VERSION" --generate-notes)
            if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
              # Marking the release prevents the tag-triggered publishers from
              # treating a prerelease as a production release.
              args+=(--prerelease)
            fi
            gh release create "v$VERSION" "${args[@]}"
          fi
      # Prereleases stay GitHub-only: the publishers intentionally skip
      # `release: published` for prereleases, so dispatching them here would
      # bypass that guard and put e.g. 0.3.0rc1 on the production indexes.
      - name: Dispatch PyPI publisher explicitly
        if: steps.version.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run release.yml --ref "v$VERSION" -f "version=$VERSION"
      # A GitHub Release created with GITHUB_TOKEN does not emit a `release`
      # event (GitHub suppresses it to prevent recursive runs), so
      # publish-npm.yml's `release: published` trigger never fires for these
      # releases. Dispatch it explicitly with the same version, exactly like
      # the PyPI publisher above.
      - name: Dispatch npm publisher explicitly
        if: steps.version.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run publish-npm.yml --ref "v$VERSION" -f "version=$VERSION"
