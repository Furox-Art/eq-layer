# Pilot engineering run only; not a final response-quality claim.
name: Open-Weight A/B Pilot

on:
  push:
    branches: [main]
    paths:
      - "eval/hf_model_server.py"
      - "eq_layer/response_experiment.py"
      - "eval/ab_generate.py"
      - "tools/build_ab_heldout.py"
      - ".github/workflows/openweight-pilot.yml"
  workflow_dispatch:

concurrency:
  group: eq-layer-openweight-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: "error"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install EQ-Layer and pilot runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ml]"
          python -m pip install "torch>=2.2,<3" "transformers>=4.46,<5"

      - name: Build external held-out source set
        run: |
          mkdir -p artifacts
          python tools/build_ab_heldout.py \
            --output artifacts/ab_heldout_120.jsonl \
            --manifest artifacts/ab_heldout_120.manifest.json \
            --seed 20261005

      - name: Train learned EQ-Layer components
        run: |
          python tools/train_emobank_affect.py \
            --output artifacts/emobank_affect.joblib
          python tools/train_xdailydialog_subtext.py \
            --output artifacts/xdailydialog_subtext.joblib

      - name: Generate same-model baseline vs EQ pilot
        run: |
          python eval/ab_generate.py \
            artifacts/ab_heldout_120.jsonl \
            artifacts/qwen_pilot_pairs.jsonl \
            artifacts/qwen_pilot_generation_manifest.json \
            --model-command "python eval/hf_model_server.py --model-id Qwen/Qwen2.5-0.5B-Instruct --max-new-tokens 80 --cpu-threads 2" \
            --model-id Qwen/Qwen2.5-0.5B-Instruct \
            --affect-model artifacts/emobank_affect.joblib \
            --subtext-model artifacts/xdailydialog_subtext.joblib \
            --temperature 0 \
            --seed 42 \
            --limit 12 \
            --persistent-model-command \
            --git-commit "$GITHUB_SHA"

      - name: Prepare blinded pilot ballot
        run: |
          python eval/ab_prepare.py \
            artifacts/qwen_pilot_pairs.jsonl \
            artifacts/qwen_pilot_ballot.jsonl \
            artifacts/qwen_pilot_key.json \
            --seed 4242

      - name: Upload unblinded pilot provenance
        uses: actions/upload-artifact@v4
        with:
          name: eq-layer-qwen-openweight-pilot-provenance
          path: |
            artifacts/ab_heldout_120.manifest.json
            artifacts/qwen_pilot_pairs.jsonl
            artifacts/qwen_pilot_generation_manifest.json
          if-no-files-found: error

      - name: Upload blinded ballot
        uses: actions/upload-artifact@v4
        with:
          name: eq-layer-qwen-openweight-pilot-ballot
          path: artifacts/qwen_pilot_ballot.jsonl
          if-no-files-found: error

      - name: Upload decode key separately
        uses: actions/upload-artifact@v4
        with:
          name: eq-layer-qwen-openweight-pilot-key
          path: artifacts/qwen_pilot_key.json
          if-no-files-found: error
