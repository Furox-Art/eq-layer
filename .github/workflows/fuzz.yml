name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "eq_layer/**"
      - "tests/fuzz/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-eq-layer
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Atheris
        run: python -m pip install atheris==3.1.0
      - name: Install eq-layer
        run: python -m pip install -e .
      - name: Fuzz strict JSON decoder
        run: python tests/fuzz/fuzz_json_contract.py -max_total_time=60 -rss_limit_mb=2048 -print_final_stats=1
