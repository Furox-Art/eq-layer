name: Complete Python Test and Branch Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install all ML and test dependencies
        run: |
          python -m pip install -e ".[dev]" "pytest-cov>=5,<8"
      - name: Require zero skipped tests and full statement and branch coverage
        run: |
          python -m pytest -q -rs tests/ --cov=eq_layer --cov-branch --cov-report=term-missing --cov-fail-under=100
