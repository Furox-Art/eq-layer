name: Complete Python Test and Branch Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install all ML and test dependencies
        run: |
          python -m pip install -e ".[dev]" "pytest-cov>=5,<8"
      - name: Require zero skipped tests and full statement and branch coverage
        run: |
          python -m pytest -q -rs tests/ --cov=eq_layer --cov-branch \
            --cov-report=term-missing --cov-fail-under=100 --junitxml=junit.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          skipped = ET.parse("junit.xml").getroot().findall(".//skipped")
          if skipped:
              raise SystemExit(f"FAIL: {len(skipped)} test(s) were skipped; the suite must run all of them")
          print("PASS: no test was skipped")
          PY
