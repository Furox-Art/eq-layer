name: EQ Layer Eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: eq-layer-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install
        run: |
          python -m pip install -e ".[ml]"
          python -m pip install build twine
      - name: Compile
        run: python -m compileall -q eq_layer eval
      - name: Build and validate PyPI package
        run: |
          rm -rf dist
          python -m build
          python -m twine check dist/*
      - name: Validate npm package
        run: |
          npm test
          npm pack --dry-run --json
      - name: Run seeded policy evaluation
        run: python eval/run.py
      - name: Run evidence-tier evaluation
        run: python eval/evidence_tier_eval.py
      - name: Run policy claim invariants
        run: python eval/policy_claims_eval.py
      - name: Run selector tie-resolution test
        run: python eval/policy_selector_eval.py
      - name: Run factored action architecture test
        run: python eval/factored_action_eval.py
      - name: Run interaction quality and repair-state test
        run: python eval/interaction_state_eval.py
      - name: Run dialogue reference-state test
        run: python eval/dialogue_reference_eval.py
      - name: Run adversarial dialogue reference benchmark
        run: python eval/dialogue_reference_adversarial_eval.py
      - name: Run session preference test
        run: python eval/session_preferences_eval.py
      - name: Run blind A/B harness smoke test
        run: python eval/ab_harness_eval.py
      - name: Run held-out sampling margin test
        run: python eval/heldout_sampling_margin_eval.py
      - name: Run routing scorer exclusion test
        run: python eval/route_score_eval.py
      - name: Run length-matched control arm test
        run: python eval/length_matched_arm_eval.py
      - name: Run arm length report test
        run: python eval/length_report_eval.py
      - name: Run length calibration selection test
        run: python eval/length_calibration_eval.py
      - name: Run response auditor test
        run: python eval/response_auditor_eval.py
      - name: Run response experiment engine smoke test
        run: python eval/response_experiment_eval.py
      - name: Run stratified pilot selection test
        run: python eval/stratified_case_selection_eval.py
      - name: Run heldout repair sampling test
        run: python eval/heldout_repair_sampling_eval.py
      - name: Run intent belief Bayes-risk test
        run: python eval/intent_belief_eval.py
      - name: Run intent risk sensitivity audit test
        run: python eval/intent_risk_sensitivity_eval.py
      - name: Run loss-matrix calibration safeguard test
        run: python eval/loss_matrix_calibration_eval.py
      - name: Run agent skill packaging test
        run: python eval/skill_packaging_eval.py
      - name: Run heldout control-state audit test
        run: python eval/heldout_control_audit_eval.py
      - name: Run intent dialogue-evidence fusion test
        run: python eval/intent_evidence_fusion_eval.py
      - name: Run trained intent evaluation
        run: python eval/intent_eval.py
