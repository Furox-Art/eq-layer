name: EQ Layer Eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[ml]"
      - name: Compile
        run: python -m compileall -q eq_layer eval
      - name: Run seeded policy evaluation
        run: python eval/run.py
      - name: Run trained intent evaluation
        run: python eval/intent_eval.py
      - name: Run EmoBank affect evaluation
        run: python eval/emobank_affect_eval.py
      - name: Run XDailyDialog dialogue-signal evaluation
        run: python eval/xdailydialog_subtext_eval.py
      - name: Run DialogBank label inventory
        run: python eval/dialogbank_inventory.py
      - name: Run Coarse Discourse disagreement inventory
        run: python eval/coarse_discourse_inventory.py
