name: EQ Layer Eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: eq-layer-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[ml]"
      - name: Compile
        run: python -m compileall -q eq_layer eval
      - name: Run seeded policy evaluation
        run: python eval/run.py
      - name: Run evidence-tier evaluation
        run: python eval/evidence_tier_eval.py
      - name: Run policy claim invariants
        run: python eval/policy_claims_eval.py
      - name: Run selector tie-resolution test
        run: python eval/policy_selector_eval.py
      - name: Run factored action architecture test
        run: python eval/factored_action_eval.py
      - name: Run interaction quality and repair-state test
        run: python eval/interaction_state_eval.py
      - name: Run blind A/B harness smoke test
        run: python eval/ab_harness_eval.py
      - name: Run response experiment engine smoke test
        run: python eval/response_experiment_eval.py
      - name: Run stratified pilot selection test
        run: python eval/stratified_case_selection_eval.py
      - name: Run heldout repair sampling test
        run: python eval/heldout_repair_sampling_eval.py
      - name: Run intent belief Bayes-risk test
        run: python eval/intent_belief_eval.py
      - name: Run intent risk sensitivity audit test
        run: python eval/intent_risk_sensitivity_eval.py
      - name: Run intent dialogue-evidence fusion test
        run: python eval/intent_evidence_fusion_eval.py
      - name: Run trained intent evaluation
        run: python eval/intent_eval.py
