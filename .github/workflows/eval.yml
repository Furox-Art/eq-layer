name: EQ Layer Eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[ml]"
      - name: Compile
        run: python -m compileall -q eq_layer eval
      - name: Run seeded policy evaluation
        run: python eval/run.py
      - name: Run trained intent evaluation
        run: python eval/intent_eval.py
