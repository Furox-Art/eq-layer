name: Publish PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.2.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# A release must never be cancelled mid-flight: cancelling between the sdist
# upload and the wheel upload leaves a half-published release on PyPI.
concurrency:
  group: release-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    # GitHub fires `release: published` for prereleases too. Publishing a
    # prerelease tag would put e.g. 0.4.0rc1 on the production index as a
    # normal release; prereleases stay GitHub-only. Manual dispatches remain
    # available for explicit recovery of an already-tagged version.
    if: github.event_name != 'release' || github.event.release.prerelease == false
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check whether this version is already on PyPI
        id: check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          PYPI_PROJECT: eq-layer
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            version="${RELEASE_TAG#v}"
          else
            version="${DISPATCH_VERSION#v}"
          fi
          export VERSION="${version}"
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          project = os.environ["PYPI_PROJECT"]
          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/{project}/{version}/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              published = False
          else:
              published = data["info"]["version"] == version
              if not published:
                  raise SystemExit(
                      f"PyPI {url} reports version {data['info']['version']!r}, expected {version!r}"
                  )
          print(f"{project} {version} already published on PyPI: {published}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"published={'true' if published else 'false'}\n")
          PY

  build-python:
    needs: preflight
    # A re-trigger of an already-published version is a no-op, not a failure.
    if: needs.preflight.outputs.published != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Always a tag: recovery dispatches must build the tagged bytes, not
          # whatever main happens to point at when the dispatch runs.
          ref: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          expected="${RELEASE_VERSION#v}"
          actual="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          echo "release=${expected} package=${actual} ref=${REF_TYPE}:${REF_NAME}"
          test "${actual}" = "${expected}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            test "${REF_TYPE}" = "tag" || {
              echo "::error::Recovery dispatches must run from the release tag v${expected}, got ${REF_TYPE}:${REF_NAME}."
              exit 1
            }
            test "${REF_NAME}" = "v${expected}" || {
              echo "::error::Checked-out ref ${REF_NAME} is not the release tag v${expected}."
              exit 1
            }
          fi
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run the test suite
        run: python -m pytest -q
      - name: Build and validate Python distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    needs: build-python
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI using trusted publishing
        # skip-existing keeps a concurrent/re-run publish from failing on files
        # the preflight saw as absent but that landed between check and upload.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
