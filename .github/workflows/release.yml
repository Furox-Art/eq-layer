name: Publish PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.2.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Always a tag: recovery dispatches must build the tagged bytes, not
          # whatever main happens to point at when the dispatch runs.
          ref: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          expected="${RELEASE_VERSION#v}"
          actual="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          echo "release=${expected} package=${actual} ref=${REF_TYPE}:${REF_NAME}"
          test "${actual}" = "${expected}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            test "${REF_TYPE}" = "tag" || {
              echo "::error::Recovery dispatches must run from the release tag v${expected}, got ${REF_TYPE}:${REF_NAME}."
              exit 1
            }
            test "${REF_NAME}" = "v${expected}" || {
              echo "::error::Checked-out ref ${REF_NAME} is not the release tag v${expected}."
              exit 1
            }
          fi
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run the test suite
        run: python -m pytest -q
      - name: Build and validate Python distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    needs: build-python
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
