name: Breakdown Audit

on:
  push:
    branches: [main]
    paths:
      - "eq_layer/dbdc3.py"
      - "eq_layer/trained_breakdown.py"
      - "eval/dbdc3_inventory.py"
      - "eval/dbdc3_breakdown_eval.py"
      - ".github/workflows/breakdown-audit.yml"
  workflow_dispatch:

concurrency:
  group: eq-layer-breakdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ML dependencies
        run: python -m pip install -e ".[ml]"
      - name: Run DBDC3 inventory
        run: python eval/dbdc3_inventory.py
      - name: Run DBDC3 breakdown benchmark
        run: python eval/dbdc3_breakdown_eval.py
