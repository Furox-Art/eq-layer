name: DialogBank Audit

on:
  push:
    branches: [main]
    paths:
      - "eq_layer/dialogbank_iso.py"
      - "eval/dialogbank_inventory.py"
      - ".github/workflows/dialogbank.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run DialogBank label inventory
        run: python eval/dialogbank_inventory.py
