name: DialogBank Audit

on:
  push:
    branches: [main]
    paths:
      - "eq_layer/dialogbank_iso.py"
      - "eval/dialogbank_inventory.py"
      - ".github/workflows/dialogbank.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run DialogBank label inventory
        run: python eval/dialogbank_inventory.py
