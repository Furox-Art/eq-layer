# Full response-generation run for blinded human evaluation.
# Generation alone is not a response-quality claim; the blinded ballot still
# requires independent ratings before inferential analysis.
name: Open-Weight Full 120 A/B Generation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/openweight-full120.yml"
  workflow_dispatch:

concurrency:
  group: eq-layer-openweight-full120-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full120:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: "error"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install EQ-Layer and generation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ml]"
          python -m pip install "torch>=2.2,<3" "transformers>=4.46,<5"

      - name: Build external held-out 120-case source set
        run: |
          mkdir -p artifacts
          python tools/build_ab_heldout.py \
            --output artifacts/ab_heldout_120.jsonl \
            --manifest artifacts/ab_heldout_120.manifest.json \
            --seed 20261005

      - name: Train learned EQ-Layer components
        run: |
          python tools/train_emobank_affect.py \
            --output artifacts/emobank_affect.joblib
          python tools/train_xdailydialog_subtext.py \
            --output artifacts/xdailydialog_subtext.joblib

      - name: Generate final-mode same-model baseline vs EQ pairs
        run: |
          python eval/ab_generate.py \
            artifacts/ab_heldout_120.jsonl \
            artifacts/qwen_full120_pairs.jsonl \
            artifacts/qwen_full120_generation_manifest.json \
            --model-command "python eval/hf_model_server.py --model-id Qwen/Qwen2.5-0.5B-Instruct --max-new-tokens 80 --cpu-threads 2" \
            --model-id Qwen/Qwen2.5-0.5B-Instruct \
            --affect-model artifacts/emobank_affect.joblib \
            --subtext-model artifacts/xdailydialog_subtext.joblib \
            --temperature 0 \
            --seed 42 \
            --persistent-model-command \
            --final \
            --git-commit "$GITHUB_SHA"

      - name: Audit routing sensitivity without tuning
        run: |
          python eval/intent_risk_sensitivity.py \
            artifacts/qwen_full120_pairs.jsonl \
            --output artifacts/qwen_full120_intent_risk_sensitivity.json

      - name: Prepare blinded 120-case ballot
        run: |
          python eval/ab_prepare.py \
            artifacts/qwen_full120_pairs.jsonl \
            artifacts/qwen_full120_ballot.jsonl \
            artifacts/qwen_full120_key.json \
            --seed 4242

      - name: Upload unblinded full-run provenance
        uses: actions/upload-artifact@v4
        with:
          name: eq-layer-qwen-full120-provenance
          path: |
            artifacts/ab_heldout_120.manifest.json
            artifacts/qwen_full120_pairs.jsonl
            artifacts/qwen_full120_generation_manifest.json
            artifacts/qwen_full120_intent_risk_sensitivity.json
          if-no-files-found: error

      - name: Upload blinded full-run ballot
        uses: actions/upload-artifact@v4
        with:
          name: eq-layer-qwen-full120-ballot
          path: artifacts/qwen_full120_ballot.jsonl
          if-no-files-found: error

      - name: Upload decode key separately
        uses: actions/upload-artifact@v4
        with:
          name: eq-layer-qwen-full120-key
          path: artifacts/qwen_full120_key.json
          if-no-files-found: error
