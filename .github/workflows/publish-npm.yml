name: Publish npm

# Publishing starts only from a published release or an explicit
# workflow_dispatch. The previous `.npm-release-request` push trigger was
# removed: any push to main that touched that file could request a publish, and
# the job checked out `github.ref` (main) instead of the release tag. The
# checkout below always resolves a tag, so the bytes published are the bytes
# that were tagged.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.2.0"
        required: true
        type: string
      use_token_fallback:
        description: "Explicitly opt into legacy token publishing (requires npm 2FA-compatible credential)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

# Never cancel a publish mid-flight: npm versions are immutable, and two
# simultaneous runs for the same tag should serialize so the second one can
# observe the first one's result and no-op.
concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    # GitHub fires `release: published` for prereleases too. Never publish a
    # prerelease GitHub tag to the stable npm tag; manual dispatches remain
    # available for explicit recovery of an already-tagged version.
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Always a tag: the release tag for `release`, or `v<version>` for an
          # explicit dispatch. Never the dispatching branch.
          ref: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Ensure OIDC-capable npm
        run: npm install --global "npm@>=11.21.0"
      - name: Verify requested version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            requested="${RELEASE_TAG#v}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            requested="${DISPATCH_VERSION#v}"
          else
            echo "::error::Unsupported event ${GITHUB_EVENT_NAME}; publish runs from a published release or workflow_dispatch only."
            exit 1
          fi
          actual="$(node -p "require('./package.json').version")"
          echo "release=${requested} package=${actual}"
          test "${actual}" = "${requested}"
          echo "version=${requested}" >> "$GITHUB_OUTPUT"
      - name: Require the matching PyPI release to be live
        # npm must never get ahead of PyPI. The dispatcher starts both jobs
        # concurrently, so this job blocks until the exact version is live on
        # the production index. A version missing from PyPI fails the job
        # instead of publishing an npm-only release.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PYPI_PROJECT: eq-layer
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          project = os.environ["PYPI_PROJECT"]
          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/{project}/{version}/json"
          attempts = 90
          delay = 10
          last_error = None
          for attempt in range(1, attempts + 1):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      data = json.load(response)
                  break
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  last_error = error
              except OSError as error:
                  last_error = error
              print(f"PyPI {project} {version} is not live yet (attempt {attempt}/{attempts}): {last_error}")
              time.sleep(delay)
          else:
              raise SystemExit(
                  f"FAIL: PyPI {project} {version} is not live after "
                  f"{attempts * delay}s ({last_error!r}); refusing to publish npm"
              )
          if data["info"]["version"] != version:
              raise SystemExit(
                  f"FAIL: PyPI reports version {data['info']['version']!r}, expected {version!r}"
              )
          print(f"PASS: {project} {version} is live on PyPI; npm may publish")
          PY
      - name: Check whether this npm version is already published
        # Re-triggering a completed release must be a no-op rather than a
        # registry E409 failure.
        id: npm-existing
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "eq-layer@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "eq-layer@${VERSION} is already on npm; publish steps will be skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate npm package
        if: steps.npm-existing.outputs.published != 'true'
        run: |
          npm test
          npm pack --dry-run --json
      - name: Publish npm package
        if: steps.npm-existing.outputs.published != 'true'
        # OIDC is the default even when a legacy NPM_TOKEN secret exists.
        #   OIDC (default)   - trusted publishing exchanges the job's identity
        #                      token and adds a provenance attestation.
        #   token (manual)   - workflow_dispatch with use_token_fallback=true
        #                      uses the NPM_TOKEN secret explicitly.
        #                       Provenance is an OIDC-only attestation, so it
        #                       is dropped in this mode rather than passed and
        #                       failing with "cannot be used with a token".
        #                       (npm 11 also refuses local provenance without
        #                       an OIDC environment: "not supported for
        #                       provider: null".)
        env:
          NODE_AUTH_TOKEN: ${{ inputs.use_token_fallback && secrets.NPM_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.use_token_fallback }}" = "true" ]; then
            if [ -z "${NODE_AUTH_TOKEN}" ]; then
              echo "::error::NPM_TOKEN is required for explicit token fallback."
              exit 1
            fi
            echo "npm publish in token mode (no provenance attestation)"
            npm publish --access public --no-provenance
          else
            echo "npm publish via trusted publishing (OIDC, provenance on)"
            npm publish --access public --provenance
          fi
