name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.2.0"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".npm-release-request"

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Ensure OIDC-capable npm
        run: npm install --global "npm@>=11.21.0"
      - name: Verify requested version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            requested="${RELEASE_TAG#v}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            requested="${DISPATCH_VERSION#v}"
          else
            requested="$(tr -d '[:space:]' < .npm-release-request)"
            requested="${requested#v}"
          fi
          actual="$(node -p "require('./package.json').version")"
          echo "release=${requested} package=${actual}"
          test "${actual}" = "${requested}"
      - name: Validate npm package
        run: |
          npm test
          npm pack --dry-run --json
      - name: Publish npm package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
