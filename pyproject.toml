[project]
name = "eq-layer"
version = "0.2.5"
description = "Inspectable intent, affect, repair, uncertainty, and factored-action control for LLM responses"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Furox-Art" },
]
keywords = [
  "llm",
  "agents",
  "agent-skills",
  "dialogue-management",
  "dialogue-policy",
  "affective-computing",
  "intent-classification",
  "llm-steering",
  "response-quality",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
ml = [
  "joblib>=1.3,<2",
  "scikit-learn>=1.5,<2",
]
dev = [
  "build>=1.2,<2",
  "joblib>=1.3,<2",
  "pytest",
  "ruff",
  "scikit-learn>=1.5,<2",
  "twine>=6,<7",
]

[project.scripts]
eq-layer = "eq_layer.cli:main"

[project.urls]
Homepage = "https://github.com/Furox-Art/eq-layer"
Repository = "https://github.com/Furox-Art/eq-layer"
Changelog = "https://github.com/Furox-Art/eq-layer/blob/main/CHANGELOG.md"
Issues = "https://github.com/Furox-Art/eq-layer/issues"
Security = "https://github.com/Furox-Art/eq-layer/blob/main/SECURITY.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eq_layer"]

[tool.hatch.build.targets.sdist]
# The sdist is the auditable source of truth: it carries the full test suite,
# the evaluation harness, the training tools and the security policy that the
# project's claims refer to, not just the importable package.
include = [
  "/eq_layer",
  "/tests",
  "/eval",
  "/tools",
  "/docs",
  "/skills",
  "/npm",
  "/.github",
  "/.codex-plugin",
  "/conftest.py",
  "/package.json",
  "/plugin.json",
  "/README.md",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/SECURITY.md",
  "/THIRD_PARTY_DATA.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
